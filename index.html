<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recibos de pago</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#1b2a24;--muted:#5d6b64;--line:#d5ddd9;--accent:#1f4fa3;--accent-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1c2521;--text:#e8f0ec;--muted:#9baba3;--line:#33403a;--accent:#5b8def;--accent-t:#06101f}}
:root[data-theme="dark"]{--bg:#121816;--card:#1c2521;--text:#e8f0ec;--muted:#9baba3;--line:#33403a;--accent:#5b8def;--accent-t:#06101f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
.card>label:first-child{margin-top:0}
input,select{width:100%;padding:12px;font-size:1.05rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input#cantidad{font-size:1.6rem;font-weight:600}
button,a.btn{display:block;width:100%;margin-top:10px;padding:13px;font-size:1rem;font-weight:600;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-t);text-align:center;text-decoration:none;cursor:pointer}
button.sec,a.btn.sec{background:transparent;color:var(--accent)}
.agente{display:flex;align-items:center;justify-content:space-between;gap:10px}
.agente button{width:auto;margin:0;padding:8px 14px}
.agente b{display:block}
.agente span{font-size:.8rem;color:var(--muted)}
.oculto{display:none}
canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);display:block}
.nota{font-size:.8rem;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Recibos de pago</h1>

<div class="card" id="cfg">
  <label for="agente">Nombre del agente (se guarda una sola vez)</label>
  <input id="agente" type="text" placeholder="Agente No. y Nombre del Agente">
  <button id="guardar" type="button">Guardar agente</button>
</div>

<div class="card oculto" id="resumen">
  <div class="agente"><div><span>Agente</span><b id="agTxt"></b></div><button id="cambiar" class="sec" type="button">Cambiar</button></div>
</div>

<div class="card oculto" id="form">
  <label for="cantidad">Cantidad pagada</label>
  <input id="cantidad" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
  <label for="metodo">Método de pago</label>
  <select id="metodo"><option>Efectivo</option><option>Transferencia</option><option>Cheque</option></select>
  <label for="folio">Folio</label>
  <input id="folio" type="text" inputmode="text" placeholder="1-1">
  <button id="generar" type="button">Generar recibo</button>
</div>

<div class="card oculto" id="salida">
  <canvas id="lienzo" width="684" height="1080"></canvas>
  <button id="compartir" type="button">Compartir imagen por WhatsApp</button>
  <button id="descargar" class="sec" type="button">Descargar imagen</button>
  <button id="nuevo" type="button">Nuevo recibo</button>
  <p class="nota" id="nota"></p>
</div>
</main>

const EMPRESA = "Fábrica de Jabón la Corona S.A. De C.V.";
const lienzo = $('lienzo'), ctx = lienzo.getContext('2d');
let blobActual = null, textoActual = '', mem = {};

function leer(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return mem[k] || ''; } }
function guardarLS(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }

const logo = new Image(); logo.src = LOGO;

function dinero(n){ return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function siguienteFolio(f){
  const m = f.match(/^(.*?)(\d+)$/);
  return m ? m[1] + String(parseInt(m[2],10)+1).padStart(m[2].length,'0') : f;
}
function pantalla(){
  const ag = leer('agente');
  $('cfg').classList.toggle('oculto', !!ag);
  $('resumen').classList.toggle('oculto', !ag);
  $('form').classList.toggle('oculto', !ag);
  if (ag){ $('agTxt').textContent = ag; $('folio').value = leer('folio') || '1-1'; $('metodo').value = leer('metodo') || 'Efectivo'; }
  else { $('agente').value = ''; $('salida').classList.add('oculto'); }
}
$('guardar').onclick = () => {
  const v = $('agente').value.trim();
  if (!v){ $('agente').focus(); return; }
  guardarLS('agente', v); pantalla(); $('cantidad').focus();
};
$('cambiar').onclick = () => { $('agente').value = leer('agente'); guardarLS('agente',''); pantalla(); $('agente').value = $('agTxt').textContent; };

function fila(izq, der, y, opts){
  opts = opts || {};
  ctx.font = (opts.bold ? 'bold ' : '') + (opts.size||27) + 'px Arial, Helvetica, sans-serif';
  ctx.fillStyle = opts.color || '#1b1b1b';
  ctx.textAlign = 'left'; ctx.fillText(izq, 32, y);
  if (der){ ctx.textAlign = 'right'; ctx.fillText(der, 652, y); }
}
function raya(y, color){
  ctx.save(); ctx.strokeStyle = color || '#d3d3d3'; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(18,y); ctx.lineTo(666,y); ctx.stroke(); ctx.restore();
}
function centrado(t, y, font, color){
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(t, 342, y);
}

function dibujar(cant, metodo, folio, agente){
  const W = lienzo.width, H = lienzo.height;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(logo, 52, 48, 596, 192);
  centrado(EMPRESA, 303, 'bold 27px Arial, Helvetica, sans-serif', '#1b1b1b');
  centrado('Comprobante de pago', 343, '28px Arial, Helvetica, sans-serif', '#7a7a7a');
  raya(376);
  centrado(dinero(cant), 458, '72px Arial, Helvetica, sans-serif', '#1b1b1b');
  centrado('Total', 506, '27px Arial, Helvetica, sans-serif', '#7a7a7a');
  raya(541);
  const f = new Date(), p = n => String(n).padStart(2,'0');
  const fecha = p(f.getDate())+'/'+p(f.getMonth()+1)+'/'+String(f.getFullYear()).slice(2)+' '+p(f.getHours())+':'+p(f.getMinutes());
  fila('FOLIO: ' + folio, '', 588);
  fila('Fecha: ' + fecha, '', 630);
  let txtAg = 'Agente: ' + agente, tam = 27;
  ctx.font = tam + 'px Arial'; while (ctx.measureText(txtAg).width > 620 && tam > 14){ tam--; ctx.font = tam + 'px Arial'; }
  fila(txtAg, '', 672, {size:tam});
  raya(742);
  fila('PAGO EN UNA SOLA EXHIBICIÓN', dinero(cant), 788);
  fila('1 × ' + dinero(cant), '', 830, {size:24, color:'#7a7a7a'});
  raya(862);
  fila('Total', dinero(cant), 912, {bold:true});
  fila(metodo, dinero(cant), 976);
  raya(1008, '#e2e2e2');
  centrado('Gracias por su pago', 1056, '27px Arial, Helvetica, sans-serif', '#7a7a7a');
  return {fecha};
}

$('generar').onclick = async () => {
  const cant = parseFloat($('cantidad').value);
  if (!(cant > 0)){ $('cantidad').focus(); return; }
  if (!logo.complete){ try{ await logo.decode(); }catch(e){} }
  const metodo = $('metodo').value, folio = $('folio').value.trim() || '1-1', agente = leer('agente');
  const r = dibujar(cant, metodo, folio, agente);
  textoActual = 'Comprobante de pago - ' + EMPRESA + '\nTotal: ' + dinero(cant) + ' (' + metodo + ')\nFOLIO: ' + folio + '\nFecha: ' + r.fecha + '\nAgente: ' + agente + '\nGracias por su pago';
  $('salida').classList.remove('oculto'); $('nota').textContent = '';
  lienzo.toBlob(b => { blobActual = b; }, 'image/png');
  guardarLS('metodo', metodo); guardarLS('folio', siguienteFolio(folio)); 
  $('salida').scrollIntoView({behavior:'smooth'});
  $('folio').value = siguienteFolio(folio);
};

$('compartir').onclick = async () => {
  if (!blobActual) return;
  const archivo = new File([blobActual], 'recibo.png', {type:'image/png'});
  try{
    if (navigator.canShare && navigator.canShare({files:[archivo]})){ await navigator.share({files:[archivo]}); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  $('nota').textContent = 'Tu navegador no permite compartir la imagen directamente. Descárgala y adjúntala en WhatsApp.';
};
$('descargar').onclick = () => {
  if (!blobActual) return;
  const url = URL.createObjectURL(blobActual), a = document.createElement('a');
  a.href = url; a.download = 'recibo.png'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};
$('nuevo').onclick = () => {
  $('cantidad').value = ''; blobActual = null; textoActual = '';
  $('nota').textContent = '';
  $('salida').classList.add('oculto');
  window.scrollTo({top:0,behavior:'smooth'});
  $('cantidad').focus();
};
pantalla();
</script>
