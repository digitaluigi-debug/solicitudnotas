<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recibos de pago</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#1b2a24;--muted:#5d6b64;--line:#d5ddd9;--accent:#1f4fa3;--accent-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1c2521;--text:#e8f0ec;--muted:#9baba3;--line:#33403a;--accent:#5b8def;--accent-t:#06101f}}
:root[data-theme="dark"]{--bg:#121816;--card:#1c2521;--text:#e8f0ec;--muted:#9baba3;--line:#33403a;--accent:#5b8def;--accent-t:#06101f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
.card>label:first-child{margin-top:0}
input,select{width:100%;padding:12px;font-size:1.05rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input.monto{font-size:1.6rem;font-weight:600}
button{display:block;width:100%;margin-top:10px;padding:13px;font-size:1rem;font-weight:600;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-t);text-align:center;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
button.grande{padding:22px;font-size:1.2rem;letter-spacing:.04em}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fila button{width:auto;margin:0;padding:8px 14px}
.fila b{display:block}
.fila span{font-size:.8rem;color:var(--muted)}
.oculto{display:none}
canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);display:block}
.nota{font-size:.8rem;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Recibos de pago</h1>

<div class="card" id="cfg">
  <label for="agente">Nombre del agente (se guarda una sola vez)</label>
  <input id="agente" type="text" placeholder="Agente No. y Nombre del Agente">
  <button id="guardar" type="button">Guardar agente</button>
</div>

<div class="card oculto" id="resumen">
  <div class="fila"><div><span>Agente</span><b id="agTxt"></b></div><button id="cambiar" class="sec" type="button">Cambiar</button></div>
</div>

<div class="card oculto" id="tipoCard">
  <label>¿Qué tipo de pago es?</label>
  <button id="btnTotal" class="grande" type="button">PAGO TOTAL</button>
  <button id="btnAbono" class="grande sec" type="button">ABONO</button>
</div>

<div class="card oculto" id="form">
  <div class="fila"><div><span>Tipo de pago</span><b id="tipoTxt"></b></div><button id="atras" class="sec" type="button">Cambiar</button></div>
  <label id="lblCant" for="cantidad">Cantidad a pagar</label>
  <input id="cantidad" class="monto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
  <div id="bloqueResto" class="oculto">
    <label for="resto">Resto del adeudo (lo que queda por pagar)</label>
    <input id="resto" class="monto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
  </div>
  <label for="metodo">Método de pago</label>
  <select id="metodo"><option>Efectivo</option><option>Transferencia</option><option>Cheque</option></select>
  <label for="folio">Folio</label>
  <input id="folio" type="text" placeholder="1-1">
  <button id="generar" type="button">Generar recibo</button>
</div>

<div class="card oculto" id="salida">
  <canvas id="lienzo" width="684" height="1080"></canvas>
  <button id="compartir" type="button">Compartir imagen por WhatsApp</button>
  <button id="descargar" class="sec" type="button">Descargar imagen</button>
  <button id="nuevo" type="button">Nuevo recibo</button>
  <p class="nota" id="nota"></p>
</div>
</main>

  const metodo = $('metodo').value, folio = $('folio').value.trim() || '1-1', agente = leer('agente');
  const f = new Date(), p = n => String(n).padStart(2,'0');
  const fecha = p(f.getDate())+'/'+p(f.getMonth()+1)+'/'+String(f.getFullYear()).slice(2)+' '+p(f.getHours())+':'+p(f.getMinutes());
  dibujar({cant, saldo, tipo, metodo, folio, agente, fecha});
  generado = true; pantalla(); $('nota').textContent = '';
  lienzo.toBlob(b => { blobActual = b; }, 'image/png');
  guardarLS('metodo', metodo); guardarLS('folio', siguienteFolio(folio));
  $('folio').value = siguienteFolio(folio);
  $('salida').scrollIntoView({behavior:'smooth'});
};

$('compartir').onclick = async () => {
  if (!blobActual) return;
  const archivo = new File([blobActual], 'recibo.png', {type:'image/png'});
  try{
    if (navigator.canShare && navigator.canShare({files:[archivo]})){ await navigator.share({files:[archivo]}); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  $('nota').textContent = 'Tu navegador no permite compartir la imagen directamente. Descárgala y adjúntala en WhatsApp.';
};
$('descargar').onclick = () => {
  if (!blobActual) return;
  const url = URL.createObjectURL(blobActual), a = document.createElement('a');
  a.href = url; a.download = 'recibo.png'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};
$('nuevo').onclick = () => {
  $('cantidad').value = ''; $('resto').value = ''; blobActual = null; $('nota').textContent = '';
  tipo = ''; generado = false; pantalla();
  window.scrollTo({top:0,behavior:'smooth'});
};
pantalla();
</script>
</body>
</html>
