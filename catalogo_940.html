<title>Generar pedido</title>
<style>
:root{--bg:#fff;--tx:#161616;--mut:#7d7d7d;--chip:#f3f2f1;--bd:#e4e4e4;--wa:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--tx:#f2f2f2;--mut:#9a9a9a;--chip:#262626;--bd:#2c2c2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--tx:#f2f2f2;--mut:#9a9a9a;--chip:#262626;--bd:#2c2c2c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;padding-bottom:100px}
.wrap{max-width:640px;margin:auto;padding:0 16px}
.top{padding:18px 0 4px;font-size:1.1rem;font-weight:700;color:var(--mut)}
.sec{padding:14px 0 6px;border-bottom:1px solid var(--bd)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh h2{margin:0;font-size:1.6rem;font-weight:600;text-transform:uppercase}
.all{border:0;background:var(--chip);color:var(--tx);font-weight:600;font-size:1rem;padding:12px 22px;border-radius:99px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0}
.im{width:80px;height:100px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--chip);overflow:hidden}
.im img{width:100%;height:100%;object-fit:contain}
.info{flex:1;min-width:0}
.nm{font-weight:600;font-size:1.05rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.iva{color:var(--mut);font-weight:600;font-size:1rem;margin-top:2px}
.pr{color:var(--mut);font-weight:600;font-size:1.1rem}
.pz{color:var(--mut);font-weight:500;font-size:.95rem}
.plus{width:64px;height:64px;flex:none;border:0;border-radius:14px;background:var(--chip);color:var(--tx);font-size:2rem;font-weight:300}
.q{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;background:var(--chip);border-radius:14px;padding:2px 0}
.q button{border:0;background:none;color:var(--tx);font-size:1.5rem;width:100%;height:30px}
.q span{font-weight:700}
#bar{position:fixed;left:12px;right:12px;max-width:616px;margin:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border:0;border-radius:14px;padding:16px 18px;display:none;justify-content:space-between;font-weight:700;font-size:1.05rem;z-index:10}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;align-items:flex-end}
#sheet{background:var(--bg);width:100%;max-width:640px;margin:auto;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sheet h2{margin:0 0 6px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it .info{font-size:.95rem;font-weight:600}
.it em{display:block;color:var(--mut);font-style:normal;font-weight:400;font-size:.85rem}
.mini{display:flex;align-items:center;gap:8px}
.mini button{width:34px;height:34px;border-radius:10px;border:0;background:var(--chip);color:var(--tx);font-size:1.2rem}
input,textarea{width:100%;margin-top:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.tot{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;margin:14px 0}
.go{width:100%;border:0;background:var(--wa);color:#06301a;font-weight:800;font-size:1.05rem;padding:15px;border-radius:12px}
.cl{background:none;border:0;color:var(--mut);width:100%;padding:10px;margin-top:4px;font-size:1rem}
</style>
</head>
<body>
<div class="wrap"><div class="top" id="shop"></div><div id="list"></div></div>
<button id="bar"><span id="bn"></span><span id="bt"></span></button>
<div id="ov"><div id="sheet">
  <h2>Tu pedido</h2>
  <div id="items"></div>

  <button class="go" id="send">Enviar pedido por WhatsApp</button>

const $=id=>document.getElementById(id);
const money=n=>"$"+n.toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
let cart={},open={};
document.title="Generar pedido";$("shop").textContent="Generar pedido";
const cats=[...CATEGORIAS,...new Set(PRODUCTOS.map(p=>p.c))].filter((c,i,a)=>a.indexOf(c)===i);
const byCod=c=>PRODUCTOS.find(p=>p.cod===c);
function ctrl(p){const q=cart[p.cod]||0;
 return q?`<div class="q"><button data-a="${p.cod}">+</button><span>${q}</span><button data-m="${p.cod}">−</button></div>`:`<button class="plus" data-a="${p.cod}" aria-label="Agregar">+</button>`}
function draw(){
 $("list").innerHTML=cats.map(c=>{
  const all=PRODUCTOS.filter(p=>p.c===c),show=open[c]?all:all.slice(0,VISIBLES);
  return `<section class="sec"><div class="sh"><h2>${c}</h2>`+(all.length>VISIBLES?`<button class="all" data-t="${c}">${open[c]?"Ver menos":"Ver todos"}</button>`:"")+`</div>`+
  (all.length?"":`<p style="color:var(--mut);padding:8px 0 16px;margin:0">Próximamente</p>`)+show.map(p=>`<div class="row"><div class="im"><img src="${IMG_BASE+p.cod+IMG_EXT}" alt="" loading="lazy" onerror="this.remove()"></div><div class="info"><div class="nm">${p.n}</div>${p.c==="Aceites"?"":`<div class="iva">Precio incluye IVA</div>`}<div class="pr">Caja ${money(p.p)}</div><div class="pz">Pieza ${money(p.pz)}</div></div>${ctrl(p)}</div>`).join("")+`</section>`}).join("");
 const n=Object.values(cart).reduce((a,b)=>a+b,0);
 $("bar").style.display=n?"flex":"none";$("bn").textContent="🛒 Ver pedido ("+n+")";$("bt").textContent=money(total());
 if($("ov").style.display==="flex"){drawCart();if(!n)$("ov").style.display="none"}}
function total(){return Object.entries(cart).reduce((s,[c,q])=>s+byCod(c).p*q,0)}
function drawCart(){
 $("items").innerHTML=Object.keys(cart).map(c=>{const p=byCod(c);return `<div class="it"><div class="info">${p.n}<em>${money(p.p)} por caja</em></div><div class="mini"><button data-m="${c}">−</button><b>${cart[c]}</b><button data-a="${c}">+</button></div></div>`}).join("");
 $("tt").textContent=money(total())}
document.addEventListener("click",e=>{const d=e.target.dataset;
 if(d.t){open[d.t]=!open[d.t]}
 else if(d.a){cart[d.a]=(cart[d.a]||0)+1}
 else if(d.m){cart[d.m]--;if(cart[d.m]<=0)delete cart[d.m]}
 else return;
 draw()});
$("bar").onclick=()=>{drawCart();$("ov").style.display="flex"};
$("close").onclick=()=>$("ov").style.display="none";
$("ov").onclick=e=>{if(e.target===$("ov"))$("ov").style.display="none"};
// ---------- Imagen del pedido (agrupada por categoría) ----------
function buildOrderImage(){
 const W=600,S=2,PAD=24,NAMEW=300,QX=400,F='-apple-system,"Segoe UI",Arial,sans-serif';
 const groups=cats.map(c=>({c,items:Object.keys(cart).map(byCod).filter(p=>p.c===c)})).filter(g=>g.items.length);
 const meas=document.createElement("canvas").getContext("2d");
 const wrap=(t,w,font)=>{meas.font=font;const out=[];let cur="";
  for(const word of t.split(/\s+/)){const x=cur?cur+" "+word:word;
   if(meas.measureText(x).width<=w||!cur)cur=x;else{out.push(cur);cur=word}}
  if(cur)out.push(cur);return out};
 const NF='600 15px '+F;
 const rows=groups.map(g=>g.items.map(p=>({p,lines:wrap(p.n,NAMEW,NF)})));
 let H=PAD+56+10;
 rows.forEach(rs=>{H+=38;rs.forEach(r=>{H+=r.lines.length*19+20+14})});
 H+=70+PAD;
 const cv=document.createElement("canvas");cv.width=W*S;cv.height=H*S;
 const x=cv.getContext("2d");x.scale(S,S);
 x.fillStyle="#fff";x.fillRect(0,0,W,H);
 let y=PAD;
 x.fillStyle="#161616";x.font='700 26px '+F;x.textBaseline="alphabetic";x.textAlign="left";x.fillText("Pedido",PAD,y+26);
 x.fillStyle="#7d7d7d";x.font='500 14px '+F;x.textAlign="right";
 x.fillText(new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"}),W-PAD,y+24);
 y+=56;x.fillStyle="#e4e4e4";x.fillRect(PAD,y,W-2*PAD,1);y+=10;
 let cajas=0,prods=0;
 groups.forEach((g,gi)=>{
  const sub=g.items.reduce((s,p)=>s+p.p*cart[p.cod],0);
  x.fillStyle="#f3f2f1";x.fillRect(PAD,y,W-2*PAD,32);
  x.fillStyle="#161616";x.font='700 15px '+F;x.textAlign="left";x.fillText(g.c.toUpperCase(),PAD+10,y+21);
  x.fillStyle="#7d7d7d";x.font='600 14px '+F;x.textAlign="right";x.fillText("Subtotal "+money(sub),W-PAD-10,y+21);
  y+=38;
  rows[gi].forEach(r=>{
   const q=cart[r.p.cod];cajas+=q;prods++;
   x.fillStyle="#161616";x.font=NF;x.textAlign="left";
   r.lines.forEach((l,i)=>x.fillText(l,PAD+10,y+15+i*19));
   const by=y+15+(r.lines.length-1)*19+19;
   x.fillStyle="#7d7d7d";x.font='400 13px '+F;x.fillText(money(r.p.p)+" por caja",PAD+10,by);
   x.fillStyle="#161616";x.font='700 16px '+F;x.textAlign="center";x.fillText(q+(q===1?" caja":" cajas"),QX+20,y+15);
   x.textAlign="right";x.fillText(money(r.p.p*q),W-PAD-10,y+15);
   y+=r.lines.length*19+20;
   x.fillStyle="#e4e4e4";x.fillRect(PAD+10,y+6,W-2*PAD-20,1);y+=14;
  });
 });
 y+=6;
 x.fillStyle="#161616";x.beginPath();x.roundRect?x.roundRect(PAD,y,W-2*PAD,52,12):x.rect(PAD,y,W-2*PAD,52);x.fill();
 x.fillStyle="#fff";x.textAlign="left";x.font='700 15px '+F;x.fillText("TOTAL · "+prods+(prods===1?" producto":" productos")+" · "+cajas+(cajas===1?" caja":" cajas"),PAD+16,y+32);
 x.textAlign="right";x.font='800 20px '+F;x.fillText(money(total()),W-PAD-16,y+33);
 return cv;
}
$("send").onclick=()=>{
 if(!Object.keys(cart).length)return;
 const cv=buildOrderImage();
 cv.toBlob(blob=>{
  const file=new File([blob],"pedido.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   // Celular: abre el menú de compartir; elige WhatsApp y tu contacto
   navigator.share({files:[file],text:"Pedido"}).catch(()=>{});
  }else{
   // Computadora: descarga la imagen y abre el chat para adjuntarla
   const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pedido.png";
   document.body.appendChild(a);a.click();a.remove();
   window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Pedido (imagen adjunta)"),"_blank");
  }
 },"image/png");
};
draw();
